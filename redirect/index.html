<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short links</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --ink:#111; --dim:#666; --bg:#fafafa; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eee; --dim:#999; --bg:#111; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--ink);
         font:14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding:24px; }
  p { color:var(--dim); margin:.4em 0; text-align:center; }
  a { color:inherit; }
</style>
</head>
<body>
  <div>
    <p>This host serves short links only.</p>
    <p>A code goes after the slash.</p>
  </div>
</body>
</html>
